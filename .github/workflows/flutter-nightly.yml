name: Flutter Nightly Build

on:
  # qdsk: nightly cron disabled on this fork to avoid burning Actions minutes;
  # trigger manually from the Actions tab if a full multi-platform build is needed.
  workflow_dispatch:

jobs:
  run-flutter-nightly-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: "nightly"
